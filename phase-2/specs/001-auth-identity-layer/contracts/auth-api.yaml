openapi: 3.1.0
info:
  title: Authentication & User Identity API
  description: |
    Authentication endpoints for the Multi-user Task Management App.

    ## Authentication Flow
    1. User signs up or signs in via Better Auth endpoints
    2. Better Auth issues JWT token
    3. Frontend includes JWT in Authorization header for API calls
    4. Backend verifies JWT and extracts user identity

    ## Token Format
    - Type: Bearer token
    - Header: `Authorization: Bearer <jwt_token>`
    - Algorithm: HS256

    ## Error Handling
    - 401: Missing, invalid, or expired token
    - 403: Valid token but unauthorized access
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:3000
    description: Frontend (Better Auth endpoints)
  - url: http://localhost:8000
    description: Backend (FastAPI endpoints)

tags:
  - name: Authentication
    description: Better Auth managed endpoints (frontend)
  - name: Backend Auth
    description: Protected backend endpoints

paths:
  # ============================================
  # Better Auth Endpoints (Frontend - Port 3000)
  # ============================================

  /api/auth/signup:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: |
        Creates a new user account with email and password.
        On success, automatically signs in and issues JWT token.
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
            example:
              email: "user@example.com"
              password: "securepassword123"
              name: "John Doe"
      responses:
        '200':
          description: User created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error (invalid email, short password, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Password must be at least 8 characters"
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Email already in use"

  /api/auth/signin:
    post:
      tags:
        - Authentication
      summary: Sign in existing user
      description: |
        Authenticates user with email and password.
        Returns JWT token on success.
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigninRequest'
            example:
              email: "user@example.com"
              password: "securepassword123"
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Invalid credentials"

  /api/auth/signout:
    post:
      tags:
        - Authentication
      summary: Sign out current user
      description: |
        Ends the current session and invalidates the session token.
        JWT remains valid until expiration but session is cleared.
      operationId: signout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successfully signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true

  /api/auth/session:
    get:
      tags:
        - Authentication
      summary: Get current session
      description: |
        Returns the current user session if authenticated.
        Used by frontend to check authentication state.
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Session found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: No valid session
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: 'null'

  # ============================================
  # Backend Endpoints (FastAPI - Port 8000)
  # ============================================

  /health:
    get:
      tags:
        - Backend Auth
      summary: Health check (public)
      description: Public endpoint to verify backend is running
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/me:
    get:
      tags:
        - Backend Auth
      summary: Get current user info (protected)
      description: |
        Returns the authenticated user's information.
        Used to verify JWT token is valid and extract user identity.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missing_token:
                  summary: No token provided
                  value:
                    detail: "Authorization header required"
                invalid_token:
                  summary: Invalid token
                  value:
                    detail: "Invalid or expired token"

  /api/v1/users/{user_id}/verify:
    get:
      tags:
        - Backend Auth
      summary: Verify user access (protected)
      description: |
        Verifies that the authenticated user has access to the specified user_id.
        Returns 403 if token user_id doesn't match URL user_id.
      operationId: verifyUserAccess
      security:
        - bearerAuth: []
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: User ID to verify access for
      responses:
        '200':
          description: Access verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  verified:
                    type: boolean
                    example: true
                  user_id:
                    type: string
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access denied (user_id mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail: "Access denied"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token issued by Better Auth.
        Include in header as: `Authorization: Bearer <token>`

  schemas:
    SignupRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: User's email address (will be normalized to lowercase)
          example: "user@example.com"
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: User's password (minimum 8 characters)
          example: "securepassword123"
        name:
          type: string
          maxLength: 100
          description: Optional display name
          example: "John Doe"

    SigninRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: "user@example.com"
        password:
          type: string
          description: User's password
          example: "securepassword123"

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        session:
          $ref: '#/components/schemas/Session'
        token:
          type: string
          description: JWT token for API authentication
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    SessionResponse:
      type: object
      properties:
        session:
          $ref: '#/components/schemas/Session'
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
          example: "usr_abc123def456"
        email:
          type: string
          format: email
          description: User's email address
          example: "user@example.com"
        name:
          type: string
          nullable: true
          description: User's display name
          example: "John Doe"
        emailVerified:
          type: boolean
          description: Whether email has been verified
          example: false
        createdAt:
          type: string
          format: date-time
          description: Account creation timestamp
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp

    Session:
      type: object
      properties:
        id:
          type: string
          description: Session identifier
        userId:
          type: string
          description: Associated user ID
        expiresAt:
          type: string
          format: date-time
          description: Session expiration time

    CurrentUserResponse:
      type: object
      properties:
        id:
          type: string
          description: User ID from JWT token
          example: "usr_abc123def456"
        email:
          type: string
          format: email
          description: User email from JWT token
          example: "user@example.com"

    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
          description: Error message
          example: "Invalid credentials"
        error:
          type: string
          description: Alternative error field (Better Auth format)
          example: "Invalid credentials"

security:
  - bearerAuth: []
